version: "3.9"

services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: tu_usuario
      POSTGRES_PASSWORD: tu_password
      POSTGRES_DB: tu_bd
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: backend_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Si quieres usar la DB local del servicio "db":
      DATABASE_URL=postgres://tu_usuario:tu_password@db:5432/tu_bd
      JWT_SECRET=clave_super_segura_para_tokens
      NODE_ENV=production
    depends_on:
      - db
    command: ["npm", "run", "dev"]

  frontend:
    build: ./frontend
    container_name: frontend_app
    restart: always
    ports:
      - "5173:80"  # mapeamos el puerto 80 de Nginx a 5173 de tu host
    depends_on:
      - backend
    environment:
      VITE_API_URL=http://backend_app:3000/api
