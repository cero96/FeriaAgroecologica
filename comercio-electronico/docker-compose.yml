version: "3.9"

services:
  db:
    image: postgres:15
    container_name: db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: Comercio_electronico
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fe_be_net

  backend_app:
    build: ./backend
    container_name: backend_app
    restart: always
    depends_on:
      - db
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: >
      sh -c "npx prisma migrate deploy &&
             npm run dev"
    networks:
      - fe_be_net

  frontend_app:
    build: ./frontend
    container_name: frontend_app
    restart: always
    depends_on:
      - backend_app
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: >
      sh -c "npm run dev -- --host"
    networks:
      - fe_be_net

volumes:
  postgres_data:

networks:
  fe_be_net:
    driver: bridge
